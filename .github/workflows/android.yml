name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout llama.cpp-omni submodule
        run: git submodule update --init --recursive --depth 1 --single-branch

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: |
          sdkmanager --install \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;4.1.2"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android signing config
        run: |
          if [ -n "${{ secrets.MINICPMV_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.MINICPMV_KEYSTORE_B64 }}" | base64 --decode > "${RUNNER_TEMP}/minicpmv-release.keystore"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEYSTORE=${RUNNER_TEMP}/minicpmv-release.keystore" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEYSTORE_PASSWORD=${{ secrets.MINICPMV_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEY_ALIAS=${{ secrets.MINICPMV_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEY_PASSWORD=${{ secrets.MINICPMV_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            DEBUG_KEYSTORE="${HOME}/.android/debug.keystore"
            if [ ! -f "$DEBUG_KEYSTORE" ]; then
              keytool -genkeypair -v \
                -keystore "$DEBUG_KEYSTORE" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEYSTORE=${DEBUG_KEYSTORE}" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "ORG_GRADLE_PROJECT_MINICPMV_KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (arm64-v8a)
        working-directory: MiniCPM-V-demo-Android
        run: bash ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniCPM-V-Android-release
          path: MiniCPM-V-demo-Android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
